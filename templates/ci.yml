# .github/workflows/qa-gate.yml — the global quality gate on every push and PR, via the published Action.
# No secrets needed: `uses: limbpuma/qa-gate@<sha>` checks out the same code every developer runs locally from
# ~/.claude/scripts/qa-gate; bump the SHA together with `gateVersion` in qa-gate.config.json (`qa-gate.sh update`).
# Supply chain: every action, the gate included, is pinned to a commit SHA (comment = the tag it was resolved from).
name: qa-gate

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '17 6 1 * *' # monthly live compliance drift check (needs the LIVE_URL repository variable)
  workflow_dispatch:

# Why: the gate only reads the checkout; security-events lets it publish its SARIF to the Security tab.
permissions:
  contents: read
  security-events: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # gate-config and the Semgrep changed-files scope compare against the base branch

      # The project's own toolchain (its tests run inside the gate); remove the blocks that do not apply.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: hashFiles('pnpm-lock.yaml') != ''
        with:
          version: 10
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: hashFiles('go.mod') != ''
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: hashFiles('pyproject.toml') != ''
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; fi
          if [ -f package-lock.json ]; then npm ci; fi
          if [ -f pyproject.toml ]; then pip install -e . ruff pytest pytest-cov pip-audit; fi
          if [ -f go.mod ]; then go install golang.org/x/vuln/cmd/govulncheck@latest; fi

      - name: Gate — pr
        id: pr
        uses: limbpuma/qa-gate@ec895f96b7ea0530d4f60fecbb1d8aa3573942a3 # v0.11.0
        with:
          stage: pr

      - name: Gate — build
        if: hashFiles('Dockerfile', 'apps/*/Dockerfile') != ''
        uses: limbpuma/qa-gate@ec895f96b7ea0530d4f60fecbb1d8aa3573942a3 # v0.11.0
        with:
          stage: build

      - name: Publish SARIF to code scanning
        # Free on public repos; a private repo without GitHub Advanced Security rejects the upload, so the step
        # never fails the job — the SARIF file is still in the artifact below.
        if: always() && hashFiles('qa-report/gate-pr.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          sarif_file: qa-report/gate-pr.sarif
          category: qa-gate/pr

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-report
          path: |
            qa-report/*.json
            qa-report/*.sarif
            qa-report/*.md
            qa-report/_logs/*.log
          retention-days: 14

  live-compliance:
    # Runs against the production URL (repository variable LIVE_URL) on the monthly schedule or by hand.
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.LIVE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Compliance against the live site
        uses: limbpuma/qa-gate@ec895f96b7ea0530d4f60fecbb1d8aa3573942a3 # v0.11.0
        with:
          stage: deploy
          base-url: ${{ vars.LIVE_URL }} # validated as https inside the action; never interpolated into a shell line
      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compliance-evidence
          path: |
            qa-report/compliance-*.md
            qa-report/compliance-scan.json
            qa-report/axe.json
            qa-report/gate-compliance.sarif
          retention-days: 400
