# .github/workflows/qa-gate.yml — runs the global quality gate on every push and PR.
# No secrets needed: the gate is fetched from the public repo limbpuma/qa-gate, the same code every
# developer runs locally from ~/.claude/scripts/qa-gate. The workflow never calls an LLM.
name: qa-gate

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '17 6 1 * *' # monthly live compliance drift check (needs the LIVE_URL repository variable)
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gate-config and the Semgrep changed-files scope compare against the base branch

      - name: Fetch qa-gate
        run: |
          git clone --depth 1 https://github.com/limbpuma/qa-gate.git "$HOME/qa-gate"
          echo "QA_GATE_HOME=$HOME/qa-gate" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        if: hashFiles('pnpm-lock.yaml') != ''
        with:
          version: 10
      - uses: actions/setup-go@v5
        if: hashFiles('go.mod') != ''
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        if: hashFiles('pyproject.toml') != ''
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; fi
          if [ -f package-lock.json ]; then npm ci; fi
          if [ -f pyproject.toml ]; then pip install -e . ruff pytest pytest-cov pip-audit; fi
          if [ -f go.mod ]; then go install golang.org/x/vuln/cmd/govulncheck@latest; fi

      - name: Gate — pr (Docker is available on ubuntu runners)
        run: bash "$QA_GATE_HOME/qa-gate.sh" pr --repo "$GITHUB_WORKSPACE"

      - name: Gate — build
        if: hashFiles('Dockerfile', 'apps/*/Dockerfile') != ''
        run: bash "$QA_GATE_HOME/qa-gate.sh" build --repo "$GITHUB_WORKSPACE"

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: |
            qa-report/*.json
            qa-report/*.md
            qa-report/_logs/*.log
          retention-days: 14

  live-compliance:
    # Runs against the production URL (repository variable LIVE_URL) on the monthly schedule or by hand.
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.LIVE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch qa-gate + browser toolchain
        run: |
          git clone --depth 1 https://github.com/limbpuma/qa-gate.git "$HOME/qa-gate"
          cd "$HOME/qa-gate" && npm install --silent --no-audit --no-fund && npx playwright install --with-deps chromium
          echo "QA_GATE_HOME=$HOME/qa-gate" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compliance against the live site
        run: bash "$QA_GATE_HOME/qa-gate.sh" compliance --repo "$GITHUB_WORKSPACE" --base-url "${{ vars.LIVE_URL }}"
      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-evidence
          path: |
            qa-report/compliance-*.md
            qa-report/compliance-scan.json
            qa-report/axe.json
          retention-days: 400
